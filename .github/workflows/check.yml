name: Checks

on:
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Linux checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          install: false
          version: 2026.10.24
          cache_key: qrscanner-mise-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml', 'Cargo.lock') }}
          cache_save_post: true
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'mise.toml') }}
      - name: Install verification tools
        run: mise install rust just cargo:cargo-deny cargo:cargo-audit gitleaks
      - name: Fetch locked dependencies
        run: mise x -- cargo fetch --locked
      - name: Check
        run: mise x -- just check
  required:
    name: Required checks
    if: always()
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: Require success
        env:
          CHECK_RESULT: ${{ needs.check.result }}
        run: test "$CHECK_RESULT" = success
