name: Verify release credentials

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-release-credentials
  cancel-in-progress: false

jobs:
  credentials:
    name: Verify proposal authentication
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: release-please
    permissions:
      contents: read
      id-token: write # Authenticate to the proposal-only Doppler identity.
    steps:
      - name: Fetch proposal credentials
        id: credentials
        uses: dopplerhq/secrets-fetch-action@451892f16195f9ac360e1a5bcbf0b5fd0e957534
        with:
          auth-method: oidc
          doppler-identity-id: ${{ vars.DOPPLER_AUTOMATION_IDENTITY_ID }}
          doppler-project: qrscanner
          doppler-config: automation
          inject-env-vars: false
      - name: Require proposal credentials
        env:
          APP_CLIENT_ID: ${{ steps.credentials.outputs.GITHUB_APP_CLIENT_ID }}
          APP_PRIVATE_KEY: ${{ steps.credentials.outputs.GITHUB_APP_PRIVATE_KEY }}
        run: |
          test -n "$APP_CLIENT_ID"
          test -n "$APP_PRIVATE_KEY"
          case "$APP_CLIENT_ID$APP_PRIVATE_KEY" in
            *\$\{*) exit 1 ;;
          esac
      - name: Create read-only repository token
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ steps.credentials.outputs.GITHUB_APP_CLIENT_ID }}
          private-key: ${{ steps.credentials.outputs.GITHUB_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: read
          permission-pull-requests: read
      - name: Verify repository identity
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: gh api repos/P4suta/qrscanner --jq 'if .id == 1446573289 and .owner.id == 42543015 then "Verified proposal authentication" else error("Repository identity mismatch") end'
