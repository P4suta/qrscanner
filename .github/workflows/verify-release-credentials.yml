name: Verify release credentials

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-release-credentials
  cancel-in-progress: false

jobs:
  credentials:
    name: Verify proposal authentication
    if: >-
      github.repository_id == '1446573289' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    environment: release-please
    permissions:
      contents: read
    env:
      APP_INPUTS_VALID: >-
        ${{ secrets.RELEASE_APP_CLIENT_ID != '' &&
        !startsWith(secrets.RELEASE_APP_CLIENT_ID, '${') &&
        secrets.RELEASE_APP_PRIVATE_KEY != '' &&
        !startsWith(secrets.RELEASE_APP_PRIVATE_KEY, '${') }}
    steps:
      - name: Require proposal credentials
        if: env.APP_INPUTS_VALID != 'true'
        run: exit 1
      - name: Create read-only repository token
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: read
      - name: Verify repository identity
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: gh api repos/P4suta/qrscanner --jq 'if .id == 1446573289 and .owner.id == 42543015 then "Verified proposal authentication" else error("Repository identity mismatch") end'
