[workspace]
members = ["crates/core", "crates/ffi", "crates/verification", "fuzz", "xtask"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
publish = false

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = "deny"

[profile.release]
lto = "thin"
strip = "debuginfo"
