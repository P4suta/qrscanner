name: QRScanner
options:
  deploymentTarget:
    macOS: "26.0"
  xcodeVersion: "27.1"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    SWIFT_EMIT_LOC_STRINGS: YES
    ENABLE_HARDENED_RUNTIME: YES
    ENABLE_DEBUG_DYLIB: NO
    CODE_SIGNING_ALLOWED: NO
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_OBJC_BRIDGING_HEADER: "$(PROJECT_DIR)/../native/Bridge/QRScannerCore.h"
    LIBRARY_SEARCH_PATHS: ["$(inherited)", "$(PROJECT_DIR)/rust/lib"]
    OTHER_LDFLAGS: ["$(inherited)", "-lqrscanner_ffi"]
targets:
  QRScanner:
    type: application
    platform: macOS
    sources:
      - native/App
      - native/Shared
      - path: native/Resources
        excludes: [QRScanner.entitlements]
        buildPhase: resources
      - path: build/assets/AppIcon.icns
        buildPhase: resources
    info:
      path: build/generated/Info.plist
      properties:
        CFBundleDisplayName: QRScanner
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        CFBundleIconFile: AppIcon
        LSUIElement: true
        NSHighResolutionCapable: true
        NSScreenCaptureUsageDescription: QRScanner reads QR codes visible on your screens when you start a scan.
        NSHumanReadableCopyright: Copyright © 2026 Yasunobu.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.p4suta.qrscanner
        INFOPLIST_FILE: "$(PROJECT_DIR)/generated/Info.plist"
        ENABLE_APP_SANDBOX: YES
        CODE_SIGN_ENTITLEMENTS: "$(PROJECT_DIR)/../native/Resources/QRScanner.entitlements"
        COMBINE_HIDPI_IMAGES: YES
    dependencies:
      - sdk: ScreenCaptureKit.framework
      - sdk: Vision.framework
  QRScannerTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: native/App
        excludes: [QRScannerApp.swift]
      - native/Shared
      - native/Tests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.p4suta.qrscanner.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  QRScanner:
    build:
      targets:
        QRScanner: all
        QRScannerTests: [test]
    test:
      targets: [QRScannerTests]
      gatherCoverageData: true
