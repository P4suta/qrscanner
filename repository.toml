name = "QRScanner"
summary = "Scan QR codes on your Mac screen and open their links in your browser"
install = """
mise trust
mise install
rustup target add --toolchain 1.99.0 aarch64-apple-darwin x86_64-apple-darwin
cargo fetch --locked
mise x -- just app"""
usage = """
open build/QRScanner.app"""
